name: CoreDent API - CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: coredent_test
          POSTGRES_PASSWORD: coredent_test
          POSTGRES_DB: coredent_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          cd coredent-api
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov httpx bandit safety
      
      - name: Check for security issues (bandit)
        run: |
          cd coredent-api
          bandit -r app/ -f json -o bandit-report.json || true
      
      - name: Check dependencies for vulnerabilities
        run: |
          cd coredent-api
          safety check --full-report || true
      
      - name: Run tests with PostgreSQL
        env:
          DATABASE_URL: postgresql://coredent_test:coredent_test@localhost:5432/coredent_test
          ENVIRONMENT: test
          SECRET_KEY: test-secret-key-at-least-32-chars-long-for-HIPAA!
          ENCRYPTION_KEY: dummy-encryption-key-not-used-in-tests
        run: |
          cd coredent-api
          pytest tests/ -v --cov=app --cov-report=term --cov-report=xml --timeout=30
      
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./coredent-api/coverage.xml

  lint:
    name: Lint
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install linters
        run: pip install flake8 mypy
      
      - name: Run flake8
        run: |
          cd coredent-api
          flake8 app/ --max-line-length=120 --extend-ignore=E203,W503 --exclude=__pycache__,migrations
      
      - name: Run mypy
        run: |
          cd coredent-api
          mypy app/ --ignore-missing-imports --warn-unused-configs || true