version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: coredent-postgres-prod
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - coredent-network

  # Redis (for caching)
  redis:
    image: redis:7-alpine
    container_name: coredent-redis-prod
    command: redis-server --requirepass ${REDIS_PASSWORD}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$${REDIS_PASSWORD}\" redis-cli --raw incr ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - coredent-network

  clamav:
    image: clamav/clamav:1.4
    restart: always
    volumes:
      - clamav_data:/var/lib/clamav
    healthcheck:
      test: ["CMD", "/usr/local/bin/clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    networks:
      - coredent-network

  # FastAPI Application
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: coredent-api-prod
    command: python /app/start.py
    environment:
      PORT: 3000
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
    ports:
      - "3000:3000"
    env_file:
      - .env.production
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      clamav:
        condition: service_healthy
    restart: always
    networks:
      - coredent-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Run schema changes exactly once before API replicas start. Uses the same
  # advisory-lock-serialised migration path as the web role.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    command: python /app/start.py
    environment:
      PROCESS_TYPE: release
    env_file:
      - .env.production
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - coredent-network

  # Durable email, communication, reminder, and integration tasks.
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: python /app/start.py
    env_file:
      - .env.production
    environment:
      PROCESS_TYPE: worker
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: always
    networks:
      - coredent-network

  # Periodic reminder scheduling. Only one beat instance may run.
  beat:
    build:
      context: .
      dockerfile: Dockerfile
    command: python /app/start.py
    env_file:
      - .env.production
    environment:
      PROCESS_TYPE: beat
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: always
    networks:
      - coredent-network

  # Hourly logical backup with seven-day local retention. Replicate this
  # directory to encrypted off-site storage in the hosting platform.
  backup:
    image: postgres:16-alpine
    command: >-
      sh -c 'while true; do
      pg_dump -Fc -h postgres -U "$${POSTGRES_USER}" "$${POSTGRES_DB}"
      > "/backups/coredent-$$(date -u +%Y%m%dT%H%M%SZ).dump" &&
      find /backups -type f -name "coredent-*.dump" -mtime +7 -delete;
      sleep 3600;
      done'
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    restart: always
    networks:
      - coredent-network

  # Nginx Reverse Proxy (optional)
  nginx:
    image: nginx:alpine
    container_name: coredent-nginx-prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.prod.conf:/etc/nginx/conf.d/default.conf
      - ./ssl:/etc/nginx/ssl
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - api
    restart: always
    networks:
      - coredent-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  clamav_data:
    driver: local

networks:
  coredent-network:
    driver: bridge
