[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
pythonpath = .

# One event loop for the whole session, for both fixtures and tests.
#
# Without these, create_test_schema (session-scoped) runs on a function-scoped
# loop while each test gets its own loop. asyncpg binds a connection to the loop
# that created it, so reusing the engine across loops fails with
#   "got Future attached to a different loop" /
#   "cannot perform operation: another operation is in progress"
#
# It went unnoticed because the local suite runs on SQLite (aiosqlite), which is
# far more forgiving of this than asyncpg. Against PostgreSQL every fixture
# errored from the first test. Pinning both scopes to session means exactly one
# loop creates and uses the connections.
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session

# Coverage configuration
addopts = 
    --cov=app
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-report=xml:coverage.xml
    --cov-fail-under=60
    --cov-config=.coveragerc
    -v

# Fail on warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning
    ignore::pydantic.warnings.PydanticDeprecatedSince20