name: CI

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ─────────────────────────────────────────────────────────────
# Backend (FastAPI / Python)
# ─────────────────────────────────────────────────────────────
jobs:
  backend:
    name: Backend — lint & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: coredent-api

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: coredent_ci
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgresql+asyncpg://ci:ci@localhost:5432/coredent_ci
      SECRET_KEY: ci-secret-key-not-for-production-use-32chars
      ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY || 'dGVzdC1lbmNyeXB0aW9uLWtleS1mb3ItY2ktb25seQ==' }}
      ENVIRONMENT: test
      DEBUG: "false"
      REDIS_URL: ""
      STRIPE_WEBHOOK_SECRET: whsec_ci_test_secret

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: coredent-api/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx ruff aiosqlite

      - name: Fatal Python lint checks
        run: ruff check app/ --output-format=github --select E9,F63,F7,F82

      - name: Compile backend
        run: python -m compileall -q app

      - name: Run tests
        run: pytest tests/ -x -q --tb=short

  # ─────────────────────────────────────────────────────────────
  # Frontend (React / TypeScript / Vite)
  # ─────────────────────────────────────────────────────────────
  frontend:
    name: Frontend — typecheck, lint & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: coredent-style-main

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: coredent-style-main/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: ESLint errors
        run: npm run lint:ci

      - name: Vitest tests
        run: npx vitest run --reporter=basic

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: http://localhost:8000
