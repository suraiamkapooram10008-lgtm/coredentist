name: CI

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend — migrate, audit, lint & test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: coredent-api

    services:
      postgres:
        # Matches the deployed Railway Postgres. CI previously ran 16 against a
        # production 18, so a migration could pass here and fail on deploy.
        image: postgres:18-alpine
        env:
          POSTGRES_DB: coredent_ci
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://ci:ci@localhost:5432/coredent_ci
      TEST_DATABASE_URL: postgresql+asyncpg://ci:ci@localhost:5432/coredent_ci
      SECRET_KEY: ci-secret-key-not-for-production-use-32chars
      ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY || 'dGVzdC1lbmNyeXB0aW9uLWtleS1mb3ItY2ktb25seQ==' }}
      ENVIRONMENT: test
      DEBUG: "false"
      REDIS_URL: ""
      STRIPE_WEBHOOK_SECRET: whsec_ci_test_secret

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: coredent-api/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install ruff

      - name: Fatal Python lint checks
        run: python -m ruff check app tests --output-format=github --select E9,F63,F7,F82

      # L-2 FIX: mypy ratchet gate. The baseline count lives in
      # scripts/mypy_baseline.txt; the gate fails on ANY increase so new
      # code cannot add type errors. Shrink the baseline with
      # `python scripts/check_mypy_ratchet.py --update` after fixing errors.
      - name: mypy ratchet gate
        run: python scripts/check_mypy_ratchet.py

      - name: Compile backend
        run: python -m compileall -q app

      # A background job that never fires is invisible. This asserts every beat
      # entry names a registered task AND is routed to a queue the worker
      # consumes, so a scheduled job cannot be published into a queue nobody
      # reads. It is the same class of defect as the retention purge that raised
      # NameError on every run while nothing observed it.
      - name: Verify Celery beat schedule is runnable
        run: python scripts/check_celery_wiring.py

      - name: Apply all migrations to a fresh PostgreSQL database
        run: python -m alembic upgrade head

      - name: Run backend test and coverage gate
        run: python -m pytest tests --tb=short

      - name: Upload backend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: |
            coredent-api/coverage.xml
            coredent-api/htmlcov
          if-no-files-found: ignore

  frontend:
    name: Frontend — audit, typecheck, lint, coverage & build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: coredent-style-main

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: coredent-style-main/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit

      - name: TypeScript type check
        run: npm run typecheck

      - name: ESLint errors
        run: npm run lint:ci

      - name: Run frontend tests
        run: npm test

      - name: Build production bundle
        run: npm run build:prod
        env:
          VITE_API_BASE_URL: https://api.example.invalid/api/v1

  # ---------------------------------------------------------------------------
  # Dependency audits, deliberately as their own jobs rather than as steps
  # inside the test jobs.
  #
  # As steps they sat FIRST in each job, so one advisory aborted the job and
  # every real gate after it was silently skipped: ruff, the mypy ratchet, the
  # "apply all migrations to a fresh PostgreSQL" step and the entire test suite.
  # That is how a PostgreSQL-only bug - hex(uuid) in the e6f7a8b9c0d1 backfill,
  # valid on SQLite where the suite ran, invalid on PostgreSQL - reached
  # production while CI merely looked "red on dependencies". Split out, an
  # advisory fails only its own job and the real gates still report.
  # ---------------------------------------------------------------------------

  backend-audit:
    name: Backend — dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: coredent-api

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: python -m pip install pip-audit

      # PYSEC-2026-3447 (setuptools) is knowingly accepted, and this is a
      # decision, not an oversight. requirements.txt pins setuptools<81 because
      # razorpay 1.4.x imports the legacy pkg_resources shim at module load, and
      # the fix version (83.0.0) removes it - the resulting ImportError takes
      # down any module that imports razorpay, i.e. payments. The real fix is to
      # drop the razorpay dependency (the product is US-focused and Stripe
      # covers payments), which also frees the pin; until then this stays
      # documented rather than silently ignored.
      - name: Audit Python dependencies
        run: >-
          python -m pip_audit --strict --requirement requirements.txt
          --ignore-vuln PYSEC-2026-3447

  frontend-audit:
    name: Frontend — dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: coredent-style-main

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: coredent-style-main/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Audit npm dependencies
        run: npm run audit:prod

  # Model/migration drift. Its own job for the same reason the audits are: as a
  # step inside the test job it SKIPPED the test suite whenever it failed, which
  # is exactly the masking behaviour this workflow was just fixed to remove.
  #
  # PostgreSQL-only. SQLite cannot support the comparison - postgresql.UUID lands
  # with NUMERIC affinity and TypeDecorators are unrepresentable, which produced
  # ~50 false positives - so the script skips with an explanation elsewhere.
  #
  # This is the gate that would have caught practices.tax_rate being declared
  # JSON in the model while the baseline migration created it NUMERIC: SQLite
  # stores that happily, PostgreSQL rejects it on the first insert, which in
  # production means the first practice sign-up.
  backend-schema-drift:
    name: Backend — model/migration schema drift
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: coredent-api

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: coredent_ci
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://ci:ci@localhost:5432/coredent_ci
      SECRET_KEY: ci-secret-key-not-for-production-use-32chars
      ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY || 'dGVzdC1lbmNyeXB0aW9uLWtleS1mb3ItY2ktb25seQ==' }}
      ENVIRONMENT: test
      DEBUG: "false"
      REDIS_URL: ""
      STRIPE_WEBHOOK_SECRET: whsec_ci_test_secret

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: coredent-api/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Apply all migrations to a fresh PostgreSQL database
        run: python -m alembic upgrade head

      - name: Check model/migration schema drift
        run: python scripts/check_schema_drift.py
