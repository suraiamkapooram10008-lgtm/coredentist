name: CI

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main]
  schedule:
    # The full backend suite. It runs for over two hours against PostgreSQL and
    # has never finished inside a job timeout, so it cannot gate a merge - it
    # would block every PR forever. The security/money/tenant subset runs on
    # every push and PR; the whole suite runs here, nightly, where being slow
    # is acceptable as long as it completes.
    - cron: "0 3 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend — migrate, audit, lint & test
    runs-on: ubuntu-latest
    # 120, not 30. With the fixture and schema defects fixed the suite executes
    # for the first time, and it runs far longer than an hour against
    # PostgreSQL - the previous two attempts were cancelled by the job timeout
    # at 30m58s and again past 59m, which reads as a cancellation and hides that
    # the tests were still running. The cap is deliberately generous so the
    # suite can complete once and produce a verdict plus the --durations report
    # needed to find what is actually slow. Tighten it once that is known.
    timeout-minutes: 120
    defaults:
      run:
        working-directory: coredent-api

    services:
      postgres:
        # Matches the deployed Railway Postgres. CI previously ran 16 against a
        # production 18, so a migration could pass here and fail on deploy.
        image: postgres:18-alpine
        env:
          POSTGRES_DB: coredent_ci
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://ci:ci@localhost:5432/coredent_ci
      TEST_DATABASE_URL: postgresql+asyncpg://ci:ci@localhost:5432/coredent_ci
      SECRET_KEY: ci-secret-key-not-for-production-use-32chars
      # Test-only key, deliberately committed: it protects nothing but CI rows.
      # It MUST be a valid 32-byte urlsafe-base64 Fernet key. The previous value
      # was dGVzdC1lbmNyeXB0aW9uLWtleS1mb3ItY2ktb25seQ==, which decodes to
      # "test-encryption-key-for-ci-only" - 31 bytes - so Fernet() raised and the
      # keyring was unavailable for the whole run. EncryptedString swallows
      # decryption failures and returns "[DECRYPTION_FAILED]", so every login
      # compared a password against that string and failed with 401, and the
      # entire tenant-isolation suite errored at fixture setup.
      ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY || 'PvnBaoBQL_jDbSXK8XbpML8gEeATsgixL0jOTi6zBY0=' }}
      ENVIRONMENT: test
      DEBUG: "false"
      REDIS_URL: ""
      STRIPE_WEBHOOK_SECRET: whsec_ci_test_secret

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: coredent-api/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install ruff

      - name: Fatal Python lint checks
        run: python -m ruff check app tests --output-format=github --select E9,F63,F7,F82

      # L-2 FIX: mypy ratchet gate. The baseline count lives in
      # scripts/mypy_baseline.txt; the gate fails on ANY increase so new
      # code cannot add type errors. Shrink the baseline with
      # `python scripts/check_mypy_ratchet.py --update` after fixing errors.
      - name: mypy ratchet gate
        run: python scripts/check_mypy_ratchet.py

      - name: Compile backend
        run: python -m compileall -q app

      # A background job that never fires is invisible. This asserts every beat
      # entry names a registered task AND is routed to a queue the worker
      # consumes, so a scheduled job cannot be published into a queue nobody
      # reads. It is the same class of defect as the retention purge that raised
      # NameError on every run while nothing observed it.
      - name: Verify Celery beat schedule is runnable
        run: python scripts/check_celery_wiring.py

      - name: Apply all migrations to a fresh PostgreSQL database
        run: python -m alembic upgrade head

      # The must-never-regress subset: tenant isolation, PHI encryption at rest,
      # the security/money paths and the retention purge. The full suite takes
      # over two hours here and has never finished inside a job timeout, so it
      # cannot gate a merge - it is run nightly by the `backend-full` job.
      #
      # --no-cov because pytest.ini sets --cov-fail-under=60, and a subset of the
      # suite cannot reach 60% of app/; the coverage gate belongs on the full run.
      - name: Run backend security, money and tenant test gate
        run: >-
          python -m pytest
          tests/test_tenant_isolation.py
          tests/test_phi_encrypted_at_rest.py
          tests/test_phase2_security_money.py
          tests/test_p2_security_regressions.py
          tests/test_retention_purge.py
          --tb=short --durations=15 --no-cov

      - name: Upload backend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: |
            coredent-api/coverage.xml
            coredent-api/htmlcov
          if-no-files-found: ignore

  frontend:
    name: Frontend — audit, typecheck, lint, coverage & build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: coredent-style-main

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: coredent-style-main/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit

      - name: TypeScript type check
        run: npm run typecheck

      - name: ESLint errors
        run: npm run lint:ci

      - name: Run frontend tests
        run: npm test

      - name: Build production bundle
        run: npm run build:prod
        env:
          VITE_API_BASE_URL: https://api.example.invalid/api/v1

  # ---------------------------------------------------------------------------
  # Dependency audits, deliberately as their own jobs rather than as steps
  # inside the test jobs.
  #
  # As steps they sat FIRST in each job, so one advisory aborted the job and
  # every real gate after it was silently skipped: ruff, the mypy ratchet, the
  # "apply all migrations to a fresh PostgreSQL" step and the entire test suite.
  # That is how a PostgreSQL-only bug - hex(uuid) in the e6f7a8b9c0d1 backfill,
  # valid on SQLite where the suite ran, invalid on PostgreSQL - reached
  # production while CI merely looked "red on dependencies". Split out, an
  # advisory fails only its own job and the real gates still report.
  # ---------------------------------------------------------------------------

  backend-audit:
    name: Backend — dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: coredent-api

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: python -m pip install pip-audit

      # PYSEC-2026-3447 (setuptools) is knowingly accepted, and this is a
      # decision, not an oversight. requirements.txt pins setuptools<81 because
      # razorpay 1.4.x imports the legacy pkg_resources shim at module load, and
      # the fix version (83.0.0) removes it - the resulting ImportError takes
      # down any module that imports razorpay, i.e. payments. The real fix is to
      # drop the razorpay dependency (the product is US-focused and Stripe
      # covers payments), which also frees the pin; until then this stays
      # documented rather than silently ignored.
      - name: Audit Python dependencies
        run: >-
          python -m pip_audit --strict --requirement requirements.txt
          --ignore-vuln PYSEC-2026-3447

  frontend-audit:
    name: Frontend — dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: coredent-style-main

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: coredent-style-main/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Audit npm dependencies
        run: npm run audit:prod

  # Model/migration drift. Its own job for the same reason the audits are: as a
  # step inside the test job it SKIPPED the test suite whenever it failed, which
  # is exactly the masking behaviour this workflow was just fixed to remove.
  #
  # PostgreSQL-only. SQLite cannot support the comparison - postgresql.UUID lands
  # with NUMERIC affinity and TypeDecorators are unrepresentable, which produced
  # ~50 false positives - so the script skips with an explanation elsewhere.
  #
  # This is the gate that would have caught practices.tax_rate being declared
  # JSON in the model while the baseline migration created it NUMERIC: SQLite
  # stores that happily, PostgreSQL rejects it on the first insert, which in
  # production means the first practice sign-up.
  backend-schema-drift:
    name: Backend — model/migration schema drift
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: coredent-api

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: coredent_ci
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://ci:ci@localhost:5432/coredent_ci
      SECRET_KEY: ci-secret-key-not-for-production-use-32chars
      # Test-only key, deliberately committed: it protects nothing but CI rows.
      # It MUST be a valid 32-byte urlsafe-base64 Fernet key. The previous value
      # was dGVzdC1lbmNyeXB0aW9uLWtleS1mb3ItY2ktb25seQ==, which decodes to
      # "test-encryption-key-for-ci-only" - 31 bytes - so Fernet() raised and the
      # keyring was unavailable for the whole run. EncryptedString swallows
      # decryption failures and returns "[DECRYPTION_FAILED]", so every login
      # compared a password against that string and failed with 401, and the
      # entire tenant-isolation suite errored at fixture setup.
      ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY || 'PvnBaoBQL_jDbSXK8XbpML8gEeATsgixL0jOTi6zBY0=' }}
      ENVIRONMENT: test
      DEBUG: "false"
      REDIS_URL: ""
      STRIPE_WEBHOOK_SECRET: whsec_ci_test_secret

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: coredent-api/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Apply all migrations to a fresh PostgreSQL database
        run: python -m alembic upgrade head

      - name: Check model/migration schema drift
        run: python scripts/check_schema_drift.py

  # The full backend suite, nightly only. It runs for over two hours against
  # PostgreSQL and has never finished inside a job timeout, so it cannot be a
  # merge gate. Here it is given enough time to complete, and its --durations
  # report is what will finally say where those two hours actually go.
  backend-full:
    name: Backend — full suite (nightly)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        working-directory: coredent-api

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: coredent_ci
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://ci:ci@localhost:5432/coredent_ci
      TEST_DATABASE_URL: postgresql+asyncpg://ci:ci@localhost:5432/coredent_ci
      SECRET_KEY: ci-secret-key-not-for-production-use-32chars
      # Test-only key, deliberately committed: it protects nothing but CI rows.
      # It MUST be a valid 32-byte urlsafe-base64 Fernet key. The previous value
      # was dGVzdC1lbmNyeXB0aW9uLWtleS1mb3ItY2ktb25seQ==, which decodes to
      # "test-encryption-key-for-ci-only" - 31 bytes - so Fernet() raised and the
      # keyring was unavailable for the whole run. EncryptedString swallows
      # decryption failures and returns "[DECRYPTION_FAILED]", so every login
      # compared a password against that string and failed with 401, and the
      # entire tenant-isolation suite errored at fixture setup.
      ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY || 'PvnBaoBQL_jDbSXK8XbpML8gEeATsgixL0jOTi6zBY0=' }}
      ENVIRONMENT: test
      DEBUG: "false"
      REDIS_URL: ""
      STRIPE_WEBHOOK_SECRET: whsec_ci_test_secret

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: coredent-api/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Apply all migrations to a fresh PostgreSQL database
        run: python -m alembic upgrade head

      - name: Run the full backend suite
        run: python -m pytest tests --tb=short --durations=30
