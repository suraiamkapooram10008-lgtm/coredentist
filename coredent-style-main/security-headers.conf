# Security headers snippet — included in every location block that uses add_header
# (nginx add_header in a location block replaces ALL server-level add_header directives)

add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
# L-3: X-XSS-Protection is deprecated; set to 0 per current security best practices
add_header X-XSS-Protection "0" always;
# L-4: Updated to stronger Referrer-Policy
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://coredentist-production.up.railway.app; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;
